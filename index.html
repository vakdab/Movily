<body style="background: #1d1f20;">
    <style>
        /* Movily: без екрану завантаження (картинка .welcome і текст кроків) */
        .welcome, .lp-step, .lp-status { display: none !important; }
        .lp-step, .lp-status { visibility: hidden !important; }
    </style>
    <script>
        /* Movily: повернення з SenPlayer (?sp=done|cancel|error&position=...). Це нова вкладка Safari: Lampa в ній
           не вантажимо, лише передаємо дані вкладці, де запускали відео (BroadcastChannel / storage), і показуємо
           «Готово». Якщо іншої вкладки вже немає, переходимо в застосунок (?spr=...), і він обробить повернення сам */
        (function () {
            try {
                var q = new URLSearchParams(location.search);
                if (!q.has('sp')) return;
                var params = {}; q.forEach(function (v, k) { if (k !== 'sp') params[k] = v; });
                delete params.t;
                var r = { kind: q.get('sp'), params: params, id: Date.now() + '-' + Math.random().toString(36).slice(2, 7) };
                window.__movily_stop = true;
                try { var bc = new BroadcastChannel('movily_sp_channel'); bc.postMessage(r); bc.close(); } catch (e) {}
                try { localStorage.setItem('movily_sp_channel', JSON.stringify(r)); } catch (e) {}
                var tp = q.get('t');
                if (tp && /^[a-z0-9]{8,64}$/i.test(tp) && window.fetch) {
                    try { fetch('https://ntfy.sh/' + tp, { method: 'POST', body: JSON.stringify(r) }).catch(function () {}); } catch (e) {}
                }
                var acked = false;
                try { var ack = new BroadcastChannel('movily_sp_channel_ack'); ack.onmessage = function () { acked = true; }; } catch (e) {}
                var uk = /^(uk|ru)/i.test(navigator.language || 'uk');
                document.addEventListener('DOMContentLoaded', function () {
                    document.title = 'Movily';
                    document.body.style.cssText = 'margin:0;background:#000';
                    document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:#fff;font:600 17px -apple-system,Helvetica,Arial,sans-serif"><div style="font-size:44px">&#10003;</div><div>' + (uk ? 'Готово. Поверніться у Movily' : 'Done. Go back to Movily') + '</div><div style="font-weight:400;opacity:.6;font-size:14px">' + (uk ? 'Цю вкладку можна закрити' : 'You can close this tab') + '</div></div>';
                    setTimeout(function () { try { window.close(); } catch (e) {} }, 500);
                    setTimeout(function () {
                        if (acked) return;
                        window.__movily_stop = false;
                        location.replace(location.pathname + '?spr=' + encodeURIComponent(JSON.stringify(r)));
                    }, 2200);
                });
            } catch (e) {}
        })();
        /* Movily: без вибору мови, інтерфейс одразу українською */
        window.lampa_settings = window.lampa_settings || {};
        window.lampa_settings.lang_use = false;
        /* Movily: адреса не змінюється при відкритті картки (?card=...). Інакше після закриття й повторного
           відкриття додатка (ярлик на екрані) одразу відкривається остання картка. Стару адресу
           з ?card= / ?component= чистимо до старту Lampa, hash лишається */
        window.lampa_settings.push_state = false;
        try {
            if (/[?&](card|component)=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
        } catch (e) {}
        /* Movily: без автоматичних і вбудованих плагінів: Lampa не вантажить розширення з акаунта та пам'яті, магазин і розділ «Розширення» вимкнені.
           Інтерфейс (moon-interface.js) і PiP (pipfs.js) підключаються напряму нижче, на це не впливає. */
        window.lampa_settings.plugins_use = false;
        window.lampa_settings.plugins_store = false;
        /* Movily: оригінальні трейлери Лампи вимкнено (кнопка «Трейлер» на картці). Трейлери беруться з The Trailer Database (movily-trailers.js) */
        window.lampa_settings.disable_features = window.lampa_settings.disable_features || {};
        window.lampa_settings.disable_features.trailers = true;
        try {
            if (!window.localStorage.getItem('language')) window.localStorage.setItem('language', 'uk');
            if (!window.localStorage.getItem('tmdb_lang')) window.localStorage.setItem('tmdb_lang', 'uk');
            /* Movily: завжди мобільний веб-інтерфейс, на будь-якому пристрої, без TV-режиму */
            window.localStorage.setItem('is_true_mobile', 'true');
            /* Movily: прибрати плагіни, які раніше додавались автоматично (UAFree, UAFilms, NB557, L-vid, Showy); вручну додані не чіпаємо */
            (function () {
                var AUTO = ['uafree.mooo.com', 'films.aartzz.pp.ua', 'nb557.github.io/plugins/free.js', 'showy.pro/online.js', 'wtch.ch'];
                var list = JSON.parse(window.localStorage.getItem('plugins') || '[]');
                if (Array.isArray(list)) {
                    var out = list.filter(function (p) {
                        var u = String(typeof p === 'string' ? p : (p && p.url) || '').toLowerCase();
                        return !AUTO.some(function (a) { return u.indexOf(a) >= 0; });
                    });
                    if (out.length !== list.length) window.localStorage.setItem('plugins', JSON.stringify(out));
                }
                window.localStorage.removeItem('moon_auto_plugins_added');
            })();
        } catch (e) {}
    </script>
    <script>
        window.youtube_lazy_load = true
    </script>

    
    <!-- Movily: екран входу (лого) -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
    
    <div id="app">

    </div>

    <div class="no-network hide">
        <div class="no-network__title">Ошибка</div>
        <div class="no-network__desc">Не удалось загрузить файл: <span class="no-network__file"></span></div>
    </div>
    
    

    <script src="./webos/webOSTV.js"></script>
    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>
    <script src="./vender/scrollbar/jquery.scrollbar.js"></script>
    <script src="./vender/navigator/navigator.js"></script>
    <script src="./vender/keypad/keypad.js"></script>

    <script>
        var lampa_url     = '';
        var cache_version = 'hide-top-pill-2-' + Math.floor((new Date()).getTime() / 9e5); // Версія коміту + нове значення кожні 15 хвилин
            
        function urlJoin(base, add) {
            if (base.charAt(base.length - 1) !== '/') {
                base += '/'
            }

            return base + add
        }

        function putScript(scripts, onload, onerror){
            if (window.__movily_stop) return
            var add = function(src){
                console.log('Loader', 'try-load-script', src)

                var trys = 0

                var sreateScript = function(){
                    var script = document.createElement('script')

                    script.type = 'text/javascript'

                    script.onload = script.onreadystatechange = function(e) {
                        console.log('Loader', 'Script loaded', e)

                        if (!!onload) onload()
                    };

                    script.onerror = function(){
                        trys++

                        console.log('Loader', 'error-load-script', src)

                        if(trys < 3){
                            sreateScript()
                        } else if (!!onerror) {
                            onerror()
                        } else{
                            $('.no-network').removeClass('hide')

                            $('.no-network__file').text(window.location.href + '/' + src)
                        }
                    }

                    script.src = src

                    document.getElementsByTagName('body')[0].appendChild(script)
                }

                sreateScript()
            }

            add(scripts)
        }

        /* Movily: інтерфейс-плагін (Snack TV) вантажиться разом із Lampa, ручне додавання не потрібне */
        function loadMovilyInterface() {
            if (window.__movily_interface_loaded) return
            window.__movily_interface_loaded = true
            putScript('plugin/dist/moon-interface.js?v=' + cache_version, function () {}, function () {})
            /* Movily: картинка в картинці (pipfs), плаваюче вікно як на iPhone */
            putScript('plugin/dist/pipfs.js?v=' + cache_version, function () {}, function () {})
            /* Movily: джерела (кнопки в ряду картки замість «Дивитись»): UAFresh і L-vid */
            putScript('https://uakino.ofreshofresh.workers.dev/uakino.js?v=' + cache_version, function () {}, function () {})
            putScript('https://beta.l-vid.online/on.js?v=' + cache_version, function () {}, function () {})
        }

        function loadCurrentLampa() {
            putScript('app.min.js?v=' + cache_version, loadMovilyInterface)
        }

        function loadLocalLampa(){
            if(lampa_url !== '') window.local_lampa = true

            loadCurrentLampa()
        }

        if (typeof AndroidJS !== "undefined"
            && !!AndroidJS.getLampaURL
            && /^https?:\/\//i.test(AndroidJS.getLampaURL())
            && !/^https?:\/\//i.test(location.href)
        ) {
            lampa_url = urlJoin(AndroidJS.getLampaURL(),'')
        }

        if (lampa_url !== '') {
            putScript(
                urlJoin(lampa_url, 'lampainit.js?v=' + cache_version),
                false,
                function(){}
            )

            putScript(
                urlJoin(lampa_url, 'app.min.js?v=' + cache_version),
                function () {
                    var css = urlJoin(lampa_url, 'css/app.css?v=' + cache_version)

                    $('head').append('<link rel="stylesheet" href="' + css + '">')

                    loadMovilyInterface()
                },
                function () {
                    putScript(
                        urlJoin(lampa_url, 'lampa-main/app.min.js?v=' + cache_version),
                        function () {
                            var css = urlJoin(lampa_url, 'lampa-main/css/app.css?v=' + cache_version)

                            $('head').append('<link rel="stylesheet" href="' + css + '">')

                            putScript(
                                urlJoin(lampa_url, 'lampainit.js?v=' + cache_version),
                                false,
                                function(){}
                            )
                        },
                        loadLocalLampa
                    )
                }
            )
        }
        else{
            loadCurrentLampa()
        }
    </script>
</body>
