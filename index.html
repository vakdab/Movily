#movily-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:#fff;color:#000;font-family:'Nunito','Arial Rounded MT Bold',system-ui,sans-serif;overflow:hidden;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:opacity .55s ease,transform .55s ease}

#movily-splash .stage{position:relative;width:min(32vw,140px);aspect-ratio:395/394}
#movily-splash .ring{position:absolute;left:50%;top:50%;width:390%;aspect-ratio:1;margin:-195% 0 0 -195%;border-radius:50%;background:repeating-conic-gradient(rgba(0,0,0,.1) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,transparent 14%,#000 22%,transparent 66%);mask:radial-gradient(circle,transparent 14%,#000 22%,transparent 66%);animation:ms-spin 50s linear infinite,ms-fadein 1.4s .9s both}
@keyframes ms-spin{to{transform:rotate(360deg)}}
@keyframes ms-fadein{from{opacity:0}to{opacity:1}}
#movily-splash h1{position:fixed;left:0;right:0;justify-content:center;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);line-height:1}
#movily-splash .icons{position:fixed;inset:0;z-index:0;pointer-events:none}
#movily-splash .dust{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#movily-splash .dust i{position:absolute;left:var(--l);top:100%;width:var(--s);height:var(--s);border-radius:50%;background:#000;opacity:0;animation:ms-rise var(--t) var(--d) linear infinite}
@keyframes ms-rise{0%{transform:translateY(0);opacity:0}10%,90%{opacity:.22}100%{transform:translateY(-108vh);opacity:0}}
#movily-splash .tag{position:fixed;left:0;right:0;text-align:center;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);margin:0;font-size:clamp(15px,4vw,18px);font-weight:800;opacity:0;animation:ms-tag .8s 1.9s ease both}
@keyframes ms-tag{from{opacity:0;transform:translateY(8px)}to{opacity:.55;transform:none}}
#movily-splash .load{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:120px;height:4px;margin-left:-60px;border-radius:4px;background:rgba(0,0,0,.1);overflow:hidden;z-index:1}
#movily-splash .load::after{content:"";position:absolute;inset:0;width:40%;border-radius:4px;background:#000;animation:ms-load 1.6s ease-in-out infinite}
@keyframes ms-load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#movily-splash .icons svg{position:absolute;left:var(--x);top:var(--y);width:var(--s,52px);height:var(--s,52px);fill:none;stroke:#000;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.15;transform:rotate(var(--r));animation:ms-bob 6s var(--d,0s) ease-in-out infinite alternate}
@keyframes ms-bob{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-14px) rotate(calc(var(--r) + 8deg))}}
#movily-splash .float{position:absolute;inset:0;animation:ms-float 4.5s 1.2s ease-in-out infinite}
#movily-splash .tri,#movily-splash .m{position:absolute;inset:0;width:100%;height:100%;display:block}
#movily-splash .tri{animation:ms-pop .9s cubic-bezier(.2,1.3,.3,1) both}

    <script>
        /* Movily: екран входу ховається, коли Lampa готова (мінімум 2.4 с, щоб анімація лого встигла зіграти) */
        (function () {
            var el = document.getElementById('movily-splash');
            if (!el) return;
            var started = Date.now(), MIN = 2400, MAX = 15000, done = false;
            function hide() {
                if (done) return; done = true;
                el.classList.add('ms-hide');
                setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
            }
            function check() {
                if (done) return;
                var ok = false;
                try { ok = !!(window.Lampa && Lampa.Listener) && !!document.querySelector('.head, .menu, .activity, .wrap__content'); } catch (e) {}
                if (ok) return setTimeout(hide, Math.max(0, MIN - (Date.now() - started)));
                if (Date.now() - started > MAX) return hide();
                setTimeout(check, 200);
            }
            check();
        })();
    </script>

    <script src="./webos/webOSTV.js"></script>
    <script src="./vender/jquery/jquery.js"></script>

    <script>
        var lampa_url     = '';
        var cache_version = Math.floor((new Date()).getTime() / 9e5); // Новое значение каждые 15 минут
            
        function urlJoin(base, add) {
            if (base.charAt(base.length - 1) !== '/') {
                base += '/'
            }

            return base + add
        }

        function putScript(scripts, onload, onerror){
            var add = function(src){
                console.log('Loader', 'try-load-script', src)

                var trys = 0

                var sreateScript = function(){
                    var script = document.createElement('script')

                    script.type = 'text/javascript'

                    script.onload = script.onreadystatechange = function(e) {
                        console.log('Loader', 'Script loaded', e)

                        if (!!onload) onload()
                    };

                    script.onerror = function(){
                        trys++

                        console.log('Loader', 'error-load-script', src)

                        if(trys < 3){
                            sreateScript()
                        } else if (!!onerror) {
                            onerror()
                        } else{
                            $('.no-network').removeClass('hide')

                            $('.no-network__file').text(window.location.href + '/' + src)
                        }
                    }

                    script.src = src

                    document.getElementsByTagName('body')[0].appendChild(script)
                }

                sreateScript()
            }

            add(scripts)
        }

        /* Movily: інтерфейс-плагін (Snack TV) вантажиться разом із Lampa, ручне додавання не потрібне */
        function loadMovilyInterface() {
            if (window.__movily_interface_loaded) return
            window.__movily_interface_loaded = true
            putScript('plugin/dist/moon-interface.js?v=' + cache_version, function () {}, function () {})
            /* Movily: картинка в картинці (pipfs), плаваюче вікно як на iPhone */
            putScript('plugin/dist/pipfs.js?v=' + cache_version, function () {}, function () {})
        }

        function loadCurrentLampa() {
            putScript('app.min.js?v=' + cache_version, loadMovilyInterface)
        }

        function loadLocalLampa(){
            if(lampa_url !== '') window.local_lampa = true

            loadCurrentLampa()
        }

        if (typeof AndroidJS !== "undefined"
            && !!AndroidJS.getLampaURL
            && /^https?:\/\//i.test(AndroidJS.getLampaURL())
            && !/^https?:\/\//i.test(location.href)
        ) {
            lampa_url = urlJoin(AndroidJS.getLampaURL(),'')
        }

        if (lampa_url !== '') {
            putScript(
                urlJoin(lampa_url, 'lampainit.js?v=' + cache_version),
                false,
                function(){}
            )

            putScript(
                urlJoin(lampa_url, 'app.min.js?v=' + cache_version),
                function () {
                    var css = urlJoin(lampa_url, 'css/app.css?v=' + cache_version)

                    $('head').append('<link rel="stylesheet" href="' + css + '">')

                    loadMovilyInterface()
                },
                function () {
                    putScript(
                        urlJoin(lampa_url, 'lampa-main/app.min.js?v=' + cache_version),
                        function () {
                            var css = urlJoin(lampa_url, 'lampa-main/css/app.css?v=' + cache_version)

                            $('head').append('<link rel="stylesheet" href="' + css + '">')

                            putScript(
                                urlJoin(lampa_url, 'lampainit.js?v=' + cache_version),
                                false,
                                function(){}
                            )
                        },
                        loadLocalLampa
                    )
                }
            )
        }
        else{
            loadCurrentLampa()
        }
    </script>
